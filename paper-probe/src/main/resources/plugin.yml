name: ExtrasProbe
version: "1"
main: net.ccbluex.liquidbounce.extras.probe.ExtrasProbe
api-version: "26.3"
depend: [GrimAC]
description: Reports Grim flags, setbacks and Paper movement corrections to the console for the game tests.
commands:
  opensign:
    description: Opens the editor of the sign at x y z for a player who never asked for it.
    usage: /opensign <player> <x> <y> <z>
    permission: extrasprobe.opensign
