# Keep these in sync with the LiquidBounce release you target. A mismatch in `minecraft`,
# `fabric-loom` or `kotlin` is the usual cause of an add-on that compiles but crashes at runtime.
[versions]
jdk = "25"

minecraft = "26.3"
fabric-loom = "1.19-SNAPSHOT"

kotlin = "2.4.20"
detekt = "2.0.0-alpha.6"

# The add-on compiles against the client itself; there is no separate API artifact.
# Use `<version>+<mc>` for a release or `<version>+<mc>-SNAPSHOT` to track nextgen.
# The game test harness comes with the client from 0.42.1 on.
liquidbounce = "0.42.1+26.3-SNAPSHOT"
# https://github.com/CCBlueX/gametest
gametest-harness = "2.0.0+26.3"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
liquidbounce = { group = "net.ccbluex", name = "liquidbounce", version.ref = "liquidbounce" }
liquidbounce-gametest = { group = "net.ccbluex", name = "liquidbounce-gametest", version.ref = "liquidbounce" }
gametest-harness = { group = "net.ccbluex", name = "gametest-harness", version.ref = "gametest-harness" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
